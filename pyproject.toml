[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quayshell"
version = "0.1.0"
description = "Persistent Wayland terminal built with GTK4, VTE4, and layer-shell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.50"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Hirt" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quayshell = "quayshell.__main__:main"

[tool.setuptools.package-data]
quayshell = ["style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
