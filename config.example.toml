[window]
width = 380
height = 72
margin = 8
# Omit monitor to start on the focused output.
# monitor = "HDMI-A-1"
# dock_namespace = "nwg-dock"
max_scale = 2.5
cross_monitor = true

[terminal]
font = "Monospace 11"
# Omit shell to use $SHELL.
# shell = "/bin/bash"

[compositor]
# auto, generic, hyprland, or sway
backend = "auto"

[behavior]
smart_collapse = true
expand_on_failure = true
notify_on_completion = true
notification_after_seconds = 5.0
result_seconds = 8.0
mascot = true
magnetic_docking = true
snap_distance = 24
